<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>攻略サイトエディタ</title>
<style>
:root{--bg:#eef0f2;--pn:#fff;--tx:#1f242b;--mu:#5f6b7a;--ln:#d3d8de;--ac:#9a6a10;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2127;--pn:#272d35;--tx:#dde2e8;--mu:#8b95a3;--ln:#3a424d;--ac:#e0a94a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2127;--pn:#272d35;--tx:#dde2e8;--mu:#8b95a3;--ln:#3a424d;--ac:#e0a94a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pn);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pn);border-bottom:1px solid var(--ln);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar h1{font-size:16px;margin:0 auto 0 0}
button{font:inherit;font-size:14px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--ln);background:var(--pn)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px}
body[data-tab="edit"] .tabs [data-tab="edit"],body[data-tab="prev"] .tabs [data-tab="prev"]{border-bottom:3px solid var(--ac);font-weight:700}
#edit{padding:12px;max-width:720px;margin:auto}
#prev{padding:0}
iframe{width:100%;height:calc(100dvh - 120px);border:0;background:#1d2127;display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:14px}
.blk{border-top:1px dashed var(--ln);padding-top:10px;margin-top:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.row input{flex:1;min-width:120px}
.sp{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
input,textarea{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;margin-top:3px}
input[type=color]{height:38px;padding:2px;width:80px}
textarea{resize:vertical;min-height:80px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre;overflow:auto;min-height:130px}
.sec input.st{font-weight:700}
.add{margin-top:10px;color:var(--mu);font-size:13px}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%}
.hint{font-size:12px;color:var(--mu);margin:0 0 12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin:12px 0 8px}
input[type=checkbox]{width:auto;margin:0;flex:none;transform:scale(1.25)}
.sub{border-top:1px dashed var(--ln);margin-top:10px;padding-top:10px}
.sub .hint{margin:6px 0 0}
@media(min-width:900px){.tabs{display:none}body{display:block}.wrap{display:grid;grid-template-columns:minmax(380px,520px) 1fr;height:calc(100dvh - 52px)}#edit,#prev{overflow:auto;height:100%;max-width:none;margin:0}#prev{display:block!important}iframe{height:100%}}
@media(max-width:899px){body[data-tab="edit"] #prev,body[data-tab="prev"] #edit{display:none}}
details.gd{border-top:1px dashed var(--ln);padding:8px 0}details.gd summary{cursor:pointer;font-weight:700;font-size:14px}.gerr{color:#c0392b;margin:0}
.pv{display:flex;gap:6px;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
#prev[data-pv="site"] [data-pv="site"],#prev[data-pv="ed"] [data-pv="ed"]{border-color:var(--ac);font-weight:700}
#prev[data-pv="site"] #fr2,#prev[data-pv="ed"] #fr{display:none}
#prev iframe{height:calc(100dvh - 170px)}
select{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;margin:6px 0}
@media(min-width:900px){#prev{display:flex!important;flex-direction:column}#prev iframe{flex:1;height:auto;min-height:0}}
</style>
</head>
<body data-tab="edit">
<div class="bar"><h1>攻略サイトエディタ</h1><button id="load">HTMLを読込</button><button id="copyhtml">HTMLをコピー</button><button id="psave">プロジェクト保存</button><button id="pload">プロジェクト読込</button><button class="pri" id="dl">ダウンロード</button><input type="file" id="file" accept=".html,text/html" hidden><input type="file" id="pfile" accept=".json,application/json" hidden><input type="file" id="sfile" accept=".js,.txt,text/javascript,text/plain" hidden></div>
<div class="tabs"><button data-tab="edit">編集</button><button data-tab="prev">プレビュー</button></div>
<div class="wrap"><div id="edit"></div><div id="prev" data-pv="site"><div class="pv"><button data-pv="site">サイト</button><button data-pv="ed">Script Editor（試用）</button></div><iframe id="fr" sandbox="allow-scripts" title="プレビュー"></iframe><iframe id="fr2" sandbox="allow-scripts allow-modals" title="エディタ試用"></iframe></div></div>
<div class="msg" id="msg"></div>
<script type="application/json" id="pkg">{"index.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n\u003cmeta name=\"mobile-web-app-capable\" content=\"yes\">\n\u003cmeta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n\u003cmeta name=\"theme-color\" content=\"#16171a\">\n\u003ctitle>Stone Script Editor\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"editor.css\">\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ca class=\"back\" href=\"../index.html\" aria-label=\"サイトへ戻る\" title=\"サイトへ戻る\">←\u003c/a>\n  \u003cdiv class=\"logo\">\u003cspan>◆\u003c/span> Stone Script \u003csmall>Editor\u003c/small>\u003c/div>\n  \u003cdiv class=\"sp\">\u003c/div>\u003cspan id=\"st\">Ln 1, Col 1\u003c/span>\n  \u003cbutton id=\"bcopy\">コピー\u003c/button>\u003cbutton id=\"bclr\">クリア\u003c/button>\n\u003c/header>\n\u003cmain>\n  \u003cdiv id=\"g\">\u003cpre id=\"gi\">1\u003c/pre>\u003c/div>\n  \u003cdiv class=\"code\">\n    \u003cpre id=\"hl\" aria-hidden=\"true\">\u003c/pre>\n    \u003ctextarea id=\"ed\" wrap=\"off\" spellcheck=\"false\" autocomplete=\"off\" autocorrect=\"off\" autocapitalize=\"off\" aria-label=\"コード入力\">\u003c/textarea>\n  \u003c/div>\n\u003c/main>\n\u003caside id=\"panel\">\n  \u003cdiv id=\"chips\">\u003c/div>\n  \u003cdiv id=\"detail\">\u003c/div>\n\u003c/aside>\n\u003cnav id=\"keys\">\n  \u003cbutton data-a=\"untab\">⇤\u003c/button>\u003cbutton data-a=\"tab\">⇥\u003c/button>\u003cbutton data-a=\"undo\">↶\u003c/button>\u003cbutton data-a=\"redo\">↷\u003c/button>\n  \u003cbutton data-t=\"?\">?\u003c/button>\u003cbutton data-t=\":\">:\u003c/button>\u003cbutton data-t=\">\">&gt;\u003c/button>\n  \u003cbutton data-t=\"@@\" data-b=\"1\">@@\u003c/button>\u003cbutton data-t=\"()\" data-b=\"1\">( )\u003c/button>\u003cbutton data-t=\"''\" data-b=\"1\">' '\u003c/button>\n  \u003cbutton data-t=\"[]\" data-b=\"1\">[ ]\u003c/button>\u003cbutton data-t=\"=\">=\u003c/button>\u003cbutton data-t=\".\">.\u003c/button>\u003cbutton data-t=\"// \">//\u003c/button>\n  \u003cbutton data-a=\"info\" id=\"tg\">ⓘ\u003c/button>\u003cbutton data-a=\"done\">完了\u003c/button>\n\u003c/nav>\n\u003cdiv id=\"toast\">\u003c/div>\n\n\u003c!-- 読み込み順が大事：snippets → gui-snippets → core → lint → flow → gui-rules → custom-rules → ui -->\n\u003cscript src=\"snippets.js\">\u003c/script>\n\u003cscript src=\"gui-snippets.js\">\u003c/script>\n\u003cscript src=\"core.js\">\u003c/script>\n\u003cscript src=\"lint.js\">\u003c/script>\n\u003cscript src=\"flow.js\">\u003c/script>\n\u003cscript src=\"gui-rules.js\">\u003c/script>\n\u003cscript src=\"custom-rules.js\">\u003c/script>\n\u003cscript src=\"ui.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "editor.css": "/* editor.css — 見た目 */\n:root{--bg:#16171a;--panel:#1e2024;--line:#2c2f35;--tx:#d9d5cc;--dim:#8a8f98;--acc:#e3a857;--fs:16px;--lh:24px;\n--mono:ui-monospace,\"SF Mono\",Menlo,Consolas,\"Noto Sans Mono CJK JP\",monospace}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml{background:var(--bg);color-scheme:dark}\nbody{margin:0;position:fixed;top:0;left:0;right:0;height:var(--vh,100dvh);display:flex;flex-direction:column;\nbackground:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,\"Hiragino Sans\",system-ui,sans-serif;overflow:hidden;\npadding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-text-size-adjust:100%}\nbutton{font-family:inherit;color:inherit;cursor:pointer}\n\nheader{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}\n.logo{font-weight:700;letter-spacing:.04em}.logo span{color:var(--acc)}.logo small{color:var(--dim);font-weight:400}\n.sp{flex:1}#st{color:var(--dim);font:12px var(--mono)}\nheader button{background:#25282d;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px}\n\nmain{flex:1;min-height:0;display:flex;background:#121316}\n#g{flex:none;overflow:hidden;background:#17181b;border-right:1px solid var(--line);padding:0 8px 0 10px;text-align:right;user-select:none}\n#gi{margin:0;padding:10px 0;font:var(--fs)/var(--lh) var(--mono);color:#555a63}\n.code{position:relative;flex:1;overflow:hidden}\n#hl,#ed{margin:0;border:0;padding:10px 14px 40vh 10px;font:var(--fs)/var(--lh) var(--mono);white-space:pre;tab-size:2;letter-spacing:0;word-spacing:0}\n#hl{position:absolute;top:0;left:0;pointer-events:none;will-change:transform;color:var(--tx)}\n#ed{position:absolute;inset:0;width:100%;height:100%;resize:none;outline:none;overflow:auto;background:transparent;\ncolor:transparent;-webkit-text-fill-color:transparent;caret-color:var(--acc);-webkit-overflow-scrolling:touch;border-radius:0}\n#ed::selection{background:rgba(227,168,87,.32)}\n.c{color:#6b7280;font-style:italic}.p{color:#98c379}.s{color:#a3be8c}.i{color:#e5c07b}.col{color:#d19a66}.n{color:#d19a66}\n.q{color:#e06c75;font-weight:700}.k{color:#c678dd}.ns{color:#61afef}.m{color:#56b6c2}\n\naside{flex:none;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}\n#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;min-height:54px;align-items:stretch;scrollbar-width:none;-webkit-overflow-scrolling:touch}\n#chips::-webkit-scrollbar{display:none}\n.chip{flex:none;max-width:70vw;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;\nbackground:#25282d;border:1px solid var(--line);border-left:3px solid var(--kc,#888);border-radius:8px;padding:3px 10px;font:13px var(--mono);text-align:left}\n.chip i{font:normal 11px -apple-system,\"Hiragino Sans\",sans-serif;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.chip.on{border-color:var(--acc);background:#33291a}\n.fn{--kc:#61afef}.prop{--kc:#56b6c2}.enemy{--kc:#e06c75}.filter{--kc:#c678dd}.import{--kc:#98c379}.item{--kc:#e5c07b}.comment{--kc:#6b7280}\n.none{color:var(--dim);font-size:13px;align-self:center}\n#detail{max-height:30vh;overflow:auto;padding:8px 12px 10px;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}\n.collapsed #detail{display:none}\n.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.dh b{font:600 14px var(--mono)}.ret{color:var(--dim);font:12px var(--mono)}\n.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--kc,#888);color:#111;font-weight:700}\n#ins{margin-left:auto;background:var(--acc);color:#1a1205;border:0;border-radius:8px;padding:5px 14px;font-weight:700}\n#detail p{margin:6px 0;white-space:pre-wrap}\npre.ex{margin:6px 0;background:#121316;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.5 var(--mono);overflow:auto;white-space:pre}\n.ins{color:var(--dim);font:12px var(--mono);word-break:break-all}\n\nnav{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#1b1d21;border-top:1px solid var(--line);scrollbar-width:none}\nnav::-webkit-scrollbar{display:none}\n.kb nav{padding-bottom:6px}\nnav button{flex:none;min-width:42px;height:38px;border:0;border-radius:8px;background:#2a2d33;font:16px var(--mono)}\nnav button:active,.chip:active{filter:brightness(1.4)}\n#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}\n#toast.on{opacity:1}\n\n@media(min-width:900px){\nbody{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto minmax(0,1fr) auto}\nheader{grid-column:1/-1}aside{grid-column:2;grid-row:2/4;border-left:1px solid var(--line);border-top:0;min-height:0}\n#chips{flex-direction:column;overflow-x:hidden;overflow-y:auto;max-height:42%;flex:none}\n.chip{max-width:none;width:100%;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}\n#detail{max-height:none;flex:1}.collapsed #detail{display:block}#tg{display:none}}\n\n/* ---- 構文チェック・フロー図（ui.js） ---- */\n#blint,#bflow{padding:0 10px;font:13px -apple-system,\"Hiragino Sans\",sans-serif}\n#blint.ok{color:#98c379}#blint.wr{color:#e5c07b}#blint.er{color:#e06c75;font-weight:700}\n#gi .ge{color:#e06c75}#gi .gw{color:#e5c07b}\n#ov{position:fixed;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top));z-index:20;background:var(--bg);display:flex;flex-direction:column;border-top:1px solid var(--line)}\n#ov[hidden]{display:none}\n.ovh{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}\n.ovh button{background:#25282d;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}\n.ovh button.on{border-color:var(--acc);background:#33291a}\n#ovb{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}\n.is{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;font-size:13px}\n.is b{display:block;font-size:12px}.is.e b{color:#e06c75}.is.w b{color:#e5c07b}\n.is span{display:block;margin:2px 0}\n.is code{display:block;color:var(--dim);font:12px var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis}\n.okm{padding:18px 14px;color:#98c379}.note{padding:8px 12px;color:var(--dim);font-size:12px;margin:0}\n.flow{display:block}.flow text{font:12px var(--mono)}\n.flow .ln{fill:none;stroke:#8a8f98;stroke-width:1.3}\n.flow .lb{fill:#8a8f98;font:11px -apple-system,sans-serif}\n.flow .nd{cursor:pointer}\n.back{color:var(--dim);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:#25282d;white-space:nowrap}\nheader .logo,header #st,header button{white-space:nowrap}\nheader .logo small{display:none}\n@media(min-width:420px){header .logo small{display:inline}}\n@media(max-width:420px){header{gap:6px;padding:0 8px}header #st{font-size:11px}header button{padding:5px 8px}}\n@media(max-width:420px){header{gap:4px;padding:0 6px}header .back{padding:4px 7px}header button{padding:5px 7px}}\n", "snippets.js": "/* ============================================================\n   ★ スニペット定義（このファイルだけ差し替えればOK）\n   元ファイルの「const snippets = [ ... ];」をそっくり貼り替えてください。\n   ・攻略サイトエディタの「snippets.jsを読込」でこのファイルを渡すと、\n     ダウンロードするZIPにも反映されます。\n   ・下はサンプルです。形式は元のままで動きます。\n   ============================================================ */\n        const snippets = [\n            { key: \".absoluteX\", insert: \"absoluteX\", desc: \" 戻り値:integer\\n画面に対するコンポーネントの絶対X位置を示します（読み取り専用）。\\n\\n var t\\n?loc.begin\\n  var p = ui.AddPanel()\\n  p.anchor = bottom_right\\n  p.dock = bottom_right\\n  t = ui.AddText('Foo')\\n  p.Add(t)\\n>`0,2,Absolute pos = @t.absoluteX@,@t.absoluteY@\\n// 絶対X位置を表示\" },\n            { key: \".absoluteY\", insert: \"absoluteY\", desc: \" 戻り値:integer\\n画面に対するコンポーネントの絶対Y位置を示します（読み取り専用）。\\n\\n var t\\n?loc.begin\\n  var p = ui.AddPanel()\\n  p.anchor = bottom_right\\n  p.dock = bottom_right\\n  t = ui.AddText('Foo')\\n  p.Add(t)\\n>`0,2,Absolute pos = @t.absoluteX@,@t.absoluteY@\\n// 絶対Y位置を表示\" },\n            { key: \".Add\", insert: \"Add($1)\", desc: \" 戻り値:なし\\nコンポーネントをパネルに追加します。コンポーネントはパネルの子となり、パネルはその親となります。追加順序は描画順に影響します。\\n\\n ?loc.begin\\n  var p = ui.AddPanel()\\n  var t = ui.AddText('Hello')\\n  p.Add(t)\\n// パネルにテキストを追加\" },\n            { key: \".Add\", insert: \"Add($1)\", desc: \" 戻り値:なし\\nコンポーネントをパネルの指定したソート位置に追加します。整数パラメータがない場合は最後の子として追加されます。\\n\\n ?loc.begin\\n  var p = ui.AddPanel()\\n  var t = ui.AddText('Hello')\\n  p.Add(t, 0)\\n// パネルの先頭にテキストを追加\" },\n            { key: \".Add\", insert: \"Add($1)\", desc: \" 戻り値:自身\\nBigNumberに数を加算します（+）。\\n\\n var bn = math.BigNumber(12)\\nbn.Add(5)\\n>@bn@\\n// 17\" },\n            { key: \".Add\", insert: \"Add($1)\", desc: \" 戻り値:なし\\n配列の末尾に新しい値またはオブジェクトを追加します。\\n\\n var myArray = []\\nmyArray.Add(10)\\n// 配列に10を追加\" },\n            { key: \".AddLayer\", insert: \"AddLayer($1)\", desc: \" 戻り値:Anim\\nこのアニメーションの上に新しいASCIIスプライトを追加します。再生中はすべてのレイヤーが同期します。\\n\\n var a = ui.AddAnim(asciiArtA)\\nvar layer2 = a.AddLayer(asciiArtB)\\nlayer2.color = '#bbbbbb'\\n// レイヤーを追加し色を設定\" },\n\n            // コメント系\n            { key: \"//\", insert: \"/ \", desc: \"1行コメント\" },\n            { key: \"/* */\", insert: \"*\\n$1\\n*/\", desc: \"ブロックコメント\" },\n            { key: \"/▼TODO▼\", insert: \"/▼TODO▼\\n$1\\n//▲TODO▲\", desc: \"TODOコメント\" },\n            {\n                key: \"/▼today▼\",\n                insert: () => {\n                    const d = new Date();\n                    const y = d.getFullYear();\n                    const m = String(d.getMonth() + 1).padStart(2, \"0\");\n                    const day = String(d.getDate()).padStart(2, \"0\");\n                    return `/▼${y}-${m}-${day}▼\\n$1\\n//▲${y}-${m}-${day}▲`;\n                },\n                desc: \"日付付きコメント\"\n            }\n            // 例: { key: \"item.right.state\", insert: \"item.right.state\", desc: \"複数セグメントの例\" },\n        ];\n", "gui-snippets.js": "/* gui-snippets.js — 攻略サイトエディタの「登録（GUI）」から自動生成（手で編集しても次回の出力で上書きされます） */\n", "core.js": "/* core.js — エディタ本体（ハイライト・補完・キー操作・コピー/クリア）\n   構文チェックは lint.js、フロー図は flow.js、チェック/フロー画面は ui.js */\n/* ============================================================\n   以下、エディタ本体\n   ============================================================ */\nconst $ = id => document.getElementById(id);\nconst ed = $('ed'), hl = $('hl'), gi = $('gi'), g = $('g'), chips = $('chips'), detail = $('detail'), panel = $('panel');\nconst STORE = 'stone-script-editor-v1';\nconst SAMPLE = ['// Stone Script サンプル', 'var count = 0', '?loc.begin', '  count = 0', '?foe.hp \u003c 10 & item.CanActivate()',\n  '  equipR vigor shield', '  activate R', ':', '  loadout 1', '>`0,1,HP = @hp@/@maxhp@'].join('\\n');\n\n/* ---------- シンタックスハイライト ---------- */\nconst RE = /(\\/\\/.*|\\/\\*[\\s\\S]*?(?:\\*\\/|$))|(^[ \\t]*>.*$)|('[^'\\n]*'|\"[^\"\\n]*\")|(@[^@\\n]*@)|(#[0-9a-fA-F]{3,8}\\b|#[a-z]+\\b)|(\\b\\d+(?:\\.\\d+)?\\b)|(^[ \\t]*[?:])|(\\b(?:var|func|for|import|new|equipL|equipR|equip|activate|loadout|disable|enable|brew|play|true|false|null)\\b)|(\\b(?:ui|math|string|color|foe|item|loc|storage|screen|draw|key|music|ambient|player|summon|sys|te|time|utc|res|buffs|debuffs|ai|encounter|harvest|pickup|pos|input|event|int)\\b(?=\\.))|(\\.[A-Za-z_]\\w*)/gm;\nconst CLS = ['c', 'p', 's', 'i', 'col', 'n', 'q', 'k', 'ns', 'm'];\nconst esc = s => s.replace(/[&\u003c>]/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;' }[c]));\nfunction highlight(src) {\n  let out = '', last = 0, m;\n  RE.lastIndex = 0;\n  while ((m = RE.exec(src))) {\n    if (m[0] === '') { RE.lastIndex++; continue; }\n    out += esc(src.slice(last, m.index));\n    const cls = CLS[m.slice(1).findIndex(x => x !== undefined)];\n    let t = esc(m[0]);\n    if (cls === 'p') t = t.replace(/@[^@\\n]*@/g, x => '\u003cspan class=\"i\">' + x + '\u003c/span>');\n    out += '\u003cspan class=\"' + cls + '\">' + t + '\u003c/span>';\n    last = RE.lastIndex;\n  }\n  return out + esc(src.slice(last));\n}\n\n/* ---------- 描画（ハイライト・行番号・スクロール同期） ---------- */\nlet lineCount = 0;\nfunction render() {\n  const v = ed.value;\n  hl.innerHTML = highlight(v) + '\\n ';\n  const n = v.split('\\n').length;\n  if (n !== lineCount) { lineCount = n; gi.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\\n'); }\n  sync(); status();\n}\nfunction sync() {\n  hl.style.transform = 'translate(' + (-ed.scrollLeft) + 'px,' + (-ed.scrollTop) + 'px)';\n  gi.style.transform = 'translateY(' + (-ed.scrollTop) + 'px)';\n}\nfunction status() {\n  const l = ed.value.slice(0, ed.selectionStart).split('\\n');\n  $('st').textContent = 'Ln ' + l.length + ', Col ' + (l[l.length - 1].length + 1);\n}\n\n/* ---------- 補完 ---------- */\nlet cands = [], active = 0, dismissed = false, lastK = '', lastPT = 'mouse';\nconst WORD = /([A-Za-z0-9_]+(?:\\.[A-Za-z0-9_]*)*)$/;\n\nfunction queryAtCursor() {\n  const left = ed.value.slice(0, ed.selectionStart);\n  const ls = left.lastIndexOf('\\n') + 1, line = left.slice(ls);\n  const im = line.match(/^[ \\t]*(import[ \\t]+[\\w\\/]*)$/);           // import Games/Sn... のように空白込みで検索\n  if (im) return { q: im[1].replace(/\\s+/, ' '), start: ls + line.length - im[1].length };\n  const m = left.match(WORD);\n  if (m) return { q: m[1], start: left.length - m[1].length };\n  if (/(^|[^\\/])\\/$/.test(left)) return { q: '/', start: left.length };\n  return { q: '', start: left.length };\n}\nfunction filterSnips(q) {\n  if (!q) return [];\n  const ql = q.toLowerCase(), dot = q.lastIndexOf('.'), after = q.slice(dot + 1).toLowerCase();\n  return snippets.filter(s => {\n    const k = s.key.toLowerCase();\n    if (k.startsWith('.')) return dot >= 0 && k.slice(1).startsWith(after);\n    if (k.startsWith('/')) return q === '/';\n    return k.startsWith(ql);\n  }).slice(0, 60);\n}\nfunction rangeFor(s) {\n  const pos = ed.selectionStart, left = ed.value.slice(0, pos);\n  if (s.key.startsWith('/')) return [pos, pos];                      // 入力済みの / は残して続きを挿入\n  if (s.key.startsWith('.')) return [left.lastIndexOf('.') + 1, pos];\n  return [queryAtCursor().start, pos];\n}\nconst KIND = { fn: '関数', prop: '値', enemy: '敵ID', filter: 'フィルタ', import: 'import', item: 'アイテムID', comment: 'コメント' };\nfunction info(s) {\n  const d = s.desc || '', first = d.split('\\n')[0].trim();\n  let kind = 'prop';\n  if (d.includes('敵のID')) kind = 'enemy';\n  else if (d.includes('検索フィルタ')) kind = 'filter';\n  else if (d.includes('importで')) kind = 'import';\n  else if (d.includes('GetCooldown()の中')) kind = 'item';\n  else if (s.key.startsWith('/')) kind = 'comment';\n  else if (typeof s.insert === 'string' && s.insert.includes('(')) kind = 'fn';\n  const ret = (first.match(/^戻り値:\\s*(.+)$/) || [])[1];\n  let sub = ret ? '→ ' + ret : '';\n  if (kind === 'enemy' || kind === 'filter') sub = first;\n  if (kind === 'item') sub = typeof s.insert === 'string' ? s.insert : '';\n  if (kind === 'comment') sub = first;\n  return { kind, sub, ret };\n}\nfunction drawChips() {\n  chips.innerHTML = '';\n  if (!cands.length) { chips.innerHTML = '\u003cspan class=\"none\">入力すると候補が出ます\u003c/span>'; return; }\n  cands.forEach((s, i) => {\n    const { kind, sub } = info(s);\n    const b = document.createElement('button');\n    b.className = 'chip ' + kind + (i === active ? ' on' : '');\n    b.dataset.i = i;\n    b.innerHTML = '\u003cspan>' + esc(s.key.trim()) + '\u003c/span>' + (sub ? '\u003ci>' + esc(sub) + '\u003c/i>' : '');\n    chips.appendChild(b);\n  });\n  chips.scrollLeft = 0; chips.scrollTop = 0;\n}\nfunction drawDetail() {\n  const s = cands[active];\n  if (!s) { detail.innerHTML = '\u003cp class=\"ret\">候補をタップすると説明が表示されます。もう一度タップ（または「挿入」）で入力されます。\u003c/p>'; return; }\n  const { kind, ret } = info(s);\n  const lines = (s.desc || '').replace(/^\\s+/, '').split('\\n');\n  const bl = lines.findIndex(l => l.trim() === '');\n  const head = bl \u003c 0 ? lines : lines.slice(0, bl);\n  let code = bl \u003c 0 ? '' : lines.slice(bl + 1).join('\\n').replace(/^ /, '');\n  const text = head.filter((l, i) => !(i === 0 && /^戻り値:/.test(l))).join('\\n');\n  const ins = typeof s.insert === 'function' ? s.insert() : (s.insert || s.key);\n  detail.innerHTML =\n    '\u003cdiv class=\"dh ' + kind + '\">\u003cspan class=\"badge\">' + KIND[kind] + '\u003c/span>\u003cb>' + esc(s.key.trim()) + '\u003c/b>' +\n    (ret ? '\u003cspan class=\"ret\">→ ' + esc(ret) + '\u003c/span>' : '') + '\u003cbutton id=\"ins\">挿入\u003c/button>\u003c/div>' +\n    (text ? '\u003cp>' + esc(text) + '\u003c/p>' : '') +\n    (code.trim() ? '\u003cpre class=\"ex\">' + highlight(code) + '\u003c/pre>' : '') +\n    '\u003cdiv class=\"ins\">挿入内容: ' + esc(ins.replace(/\\$1/g, '▮').replace(/\\n/g, ' ⏎ ')) + '\u003c/div>';\n}\nfunction setActive(i) {\n  active = i;\n  chips.querySelectorAll('.chip').forEach((c, j) => c.classList.toggle('on', j === i));\n  drawDetail();\n}\nfunction refresh() {\n  lastK = ed.selectionStart + ':' + ed.value.length;\n  cands = dismissed ? [] : filterSnips(queryAtCursor().q);\n  active = 0; drawChips(); drawDetail();\n}\n\n/* ---------- 入力操作 ---------- */\nfunction typeText(t) {\n  ed.focus();\n  if (!document.execCommand('insertText', false, t)) {              // 失敗時のみフォールバック（undo履歴は途切れる）\n    ed.setRangeText(t, ed.selectionStart, ed.selectionEnd, 'end');\n    onInput();\n  }\n}\nfunction insertSnippet(s) {\n  if (!s) return;\n  const [a, b] = rangeFor(s);\n  let t = typeof s.insert === 'function' ? s.insert() : (s.insert || s.key);\n  let off = t.indexOf('$1');\n  if (off >= 0) t = t.replace('$1', ''); else off = t.length;\n  ed.focus(); ed.setSelectionRange(a, b);\n  typeText(t);\n  ed.setSelectionRange(a + off, a + off);\n  status(); refresh();\n}\nfunction indent(dir) {\n  const v = ed.value, a = ed.selectionStart, b = ed.selectionEnd;\n  if (dir > 0 && a === b) { typeText('  '); return; }\n  const ls = v.lastIndexOf('\\n', a - 1) + 1;\n  let le = v.indexOf('\\n', b); if (le \u003c 0) le = v.length;\n  const block = v.slice(ls, le);\n  const out = block.split('\\n').map(l => dir > 0 ? '  ' + l : l.replace(/^ {1,2}|^\\t/, '')).join('\\n');\n  ed.focus(); ed.setSelectionRange(ls, le); typeText(out);\n  if (a === b) { const p = Math.max(ls, a - (block.length - out.length)); ed.setSelectionRange(p, p); }\n  else ed.setSelectionRange(ls, ls + out.length);\n}\n\nlet saveTimer;\nfunction onInput() {\n  dismissed = false; render(); refresh();\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, ed.value); } catch (e) {} }, 400);\n}\ned.addEventListener('input', onInput);\ned.addEventListener('scroll', sync, { passive: true });\ndocument.addEventListener('selectionchange', () => {\n  if (document.activeElement !== ed) return;\n  status();\n  if (ed.selectionStart + ':' + ed.value.length !== lastK) refresh();\n});\n\ned.addEventListener('keydown', e => {\n  if (e.isComposing) return;\n  if (e.key === 'Tab') {\n    e.preventDefault();\n    if (!e.shiftKey && cands.length && queryAtCursor().q) insertSnippet(cands[active]);\n    else indent(e.shiftKey ? -1 : 1);\n    return;\n  }\n  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) {  // オートインデント\n    const v = ed.value, pos = ed.selectionStart, ls = v.lastIndexOf('\\n', pos - 1) + 1, line = v.slice(ls, pos);\n    let ind = line.match(/^[ \\t]*/)[0];\n    if (/^\\s*(\\?|:\\s*$|func\\b|for\\b)/.test(line)) ind += '  ';\n    e.preventDefault(); typeText('\\n' + ind); return;\n  }\n  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && cands.length) {\n    e.preventDefault();\n    setActive((active + (e.key === 'ArrowDown' ? 1 : cands.length - 1)) % cands.length);\n    const c = chips.children[active]; if (c) c.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n    return;\n  }\n  if (e.key === 'Escape') { dismissed = true; refresh(); }\n});\n\n/* ---------- パネル・キーバー操作 ---------- */\ndocument.addEventListener('pointerdown', e => { lastPT = e.pointerType; });\n[panel, $('keys')].forEach(el => el.addEventListener('mousedown', e => e.preventDefault()));  // PCでフォーカスを奪わない\nchips.addEventListener('click', e => {\n  const b = e.target.closest('.chip'); if (!b) return;\n  const i = +b.dataset.i;\n  if (lastPT === 'mouse' || i === active) insertSnippet(cands[i]); else setActive(i);  // タッチは1回目=説明、2回目=挿入\n});\nchips.addEventListener('pointerover', e => {\n  if (e.pointerType !== 'mouse') return;\n  const b = e.target.closest('.chip'); if (b && +b.dataset.i !== active) setActive(+b.dataset.i);\n});\ndetail.addEventListener('click', e => { if (e.target.closest('#ins')) insertSnippet(cands[active]); });\n$('keys').addEventListener('click', e => {\n  const b = e.target.closest('button'); if (!b) return;\n  const a = b.dataset.a;\n  if (a === 'tab') indent(1);\n  else if (a === 'untab') indent(-1);\n  else if (a === 'undo') { ed.focus(); document.execCommand('undo'); }\n  else if (a === 'redo') { ed.focus(); document.execCommand('redo'); }\n  else if (a === 'info') panel.classList.toggle('collapsed');\n  else if (a === 'done') ed.blur();\n  else if (b.dataset.t) {\n    typeText(b.dataset.t);\n    if (b.dataset.b) { const p = ed.selectionStart - 1; ed.setSelectionRange(p, p); }\n  }\n});\n\n/* ---------- コピー / クリア ---------- */\nfunction toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1400); }\n$('bcopy').addEventListener('click', async () => {\n  try { await navigator.clipboard.writeText(ed.value); }\n  catch (e) { ed.select(); document.execCommand('copy'); }\n  toast('コピーしました');\n});\n$('bclr').addEventListener('click', () => {\n  if (!ed.value || !confirm('エディタの内容をすべて消しますか？')) return;\n  ed.value = ''; onInput();\n});\n\n/* ---------- iPhone：キーボード表示時のレイアウト追従 ---------- */\nfunction fit() {\n  const v = window.visualViewport; if (!v) return;\n  document.body.style.setProperty('--vh', v.height + 'px');\n  document.body.style.transform = 'translateY(' + v.offsetTop + 'px)';\n  document.body.classList.toggle('kb', innerHeight - v.height > 120);\n}\nif (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); fit(); }\nif (innerHeight \u003c 700) panel.classList.add('collapsed');\n\n/* ---------- サイトから渡されたコード（URLの #code=...） ---------- */\nfunction loadHandoff() {\n  const m = location.hash.match(/^#code=(.*)$/); if (!m) return;\n  let code = null;\n  try { code = decodeURIComponent(m[1]); } catch (e) {}\n  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}\n  if (code === null || code === ed.value) return;\n  if (ed.value.trim() && !confirm('サイトのサンプルコードを読み込みます。\\n今のエディタの内容は上書きされます。よろしいですか？')) return;\n  ed.value = code;\n  try { localStorage.setItem(STORE, code); チェック／フロー図）\n   ------------------------------------------------------------\n   lint.js・flow.js の「後」に読み込まれるので、ここから\n     ・チェックルールの追加   … SS.addLineRule / SS.addFileRule / SS.addStmtHandler\n     ・設定テーブルの書き換え … SS.HINT / SS.CMDS / SS.WRONG_WORDS / SS.DISABLE_TARGETS\n     ・フロー図の見た目変更   … SS.flow.cfg / SS.flow.colors / SS.flow.stmtColors\n   が行えます。組み込みのファイルは触らずに済みます。\n   詳しい書き方は README.md を参照。\n   ============================================================ */\n(function (SS) {\n'use strict';\n\n/* ▼▼▼ ここから自分のルールを書く ▼▼▼ */\n\n\n\n/* ▲▲▲ ここまで ▲▲▲ */\n\n\n/* ------------------------------------------------------------\n   サンプル集：下の ENABLE_SAMPLES を true にすると動きます。\n   動作を確認したら、コピーして上の「自分のルール」欄に移し、false に戻してください。\n   ------------------------------------------------------------ */\nconst ENABLE_SAMPLES = false;\nif (!ENABLE_SAMPLES) return;\n\n// 例1) 行ルール：1文字の変数名に注意を出す\n//   ctx.text … コメント除去・^結合済みの行（前後の空白なし）\n//   ctx.add('w' か 'e', メッセージ) … その行に指摘を追加\nSS.addLineRule(ctx => {\n  const m = ctx.text.match(/^var\\s+([A-Za-z_])\\b/);\n  if (m) ctx.add('w', '変数名「' + m[1] + '」は短すぎます（意味が分かる名前がおすすめ）');\n});\n\n// 例2) ファイルルール：インデント0の var の二重宣言\n//   ctx.lines … 全ての論理行 [{ no, ind, text }]\n//   ctx.add(行番号, 'w'|'e', メッセージ)\nSS.addFileRule(ctx => {\n  const seen = {};\n  ctx.lines.forEach(l => {\n    const m = l.ind === 0 && l.text.match(/^var\\s+([A-Za-z_]\\w*)/);\n    if (!m) return;\n    if (seen[m[1]]) ctx.add(l.no, 'w', '「' + m[1] + '」は ' + seen[m[1]] + ' 行目で宣言済みです');\n    else seen[m[1]] = l.no;\n  });\n});\n\n// 例3) 新しいコマンドを「既知の文」にする（架空のコマンド shout）\n//   true を返すと「不明な書き方です」が出なくなります\nSS.CMDS.push('shout');            // 「もしかして」の候補にも入れる\nSS.addStmtHandler((t, ctx) => {\n  if (!/^shout\\b/.test(t)) return false;\n  if (!/^shout\\s+\\S/.test(t)) ctx.add('e', 'shout の後に文字が必要です');\n  return true;\n});\n\n// 例4) 他言語のキーワードを間違いとして検出し、ヒントを出す\nSS.WRONG_WORDS.push('switch');\nSS.HINT.switch = 'switch はありません。「?条件」と「:?条件」を並べて書きます';\n\n// 例5) フロー図の見た目を変える\nSS.flow.stmtColors.unshift([/^(disable|enable)\\b/, '#e06c75']);   // disable/enable を赤系に\nSS.flow.cfg.yes = 'YES';                                          // 「はい」ラベルを変更\n})(window.SS = window.SS || {});\n", "ui.js": "/* ============================================================\n   ui.js — 「✓」ボタン／チェック一覧／フロー図の画面／行番号の色付け\n   ------------------------------------------------------------\n   core.js が作る $ ed gi esc sync status を使います（読み込み順: core → lint → flow → custom-rules → ui）。\n   ルールや図の中身を変えたいときは lint.js / flow.js / custom-rules.js を触る。ここは画面まわり専用。\n   ============================================================ */\n(function () {\nconst SS = window.SS;\nconst nav = $('keys');\nnav.insertAdjacentHTML('afterbegin', '\u003cbutton id=\"blint\" class=\"ok\">✓\u003c/button>\u003cbutton id=\"bflow\">フロー\u003c/button>');\ndocument.body.insertAdjacentHTML('beforeend',\n  '\u003cdiv id=\"ov\" hidden>\u003cdiv class=\"ovh\">\u003cbutton data-tab=\"lint\">チェック\u003c/button>\u003cbutton data-tab=\"flow\">フロー図\u003c/button>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"ovx\">✕ 閉じる\u003c/button>\u003c/div>\u003cdiv id=\"ovb\">\u003c/div>\u003c/div>');\n\nlet ovTab = 'lint', issues = [], lintTimer;\n\nfunction paintGutter() {\n  const n = ed.value.split('\\n').length, m = {};\n  issues.forEach(x => { if (m[x.no] !== 'e') m[x.no] = x.lv; });\n  gi.innerHTML = Array.from({ length: n }, (_, i) => m[i + 1] ? '\u003cspan class=\"g' + m[i + 1] + '\">' + (i + 1) + '\u003c/span>' : (i + 1)).join('\\n');\n}\nfunction runLint() {\n  issues = SS.lint(ed.value);\n  const e = issues.filter(x => x.lv === 'e').length, w = issues.length - e, b = $('blint');\n  b.textContent = e ? '✖' + e : w ? '⚠' + w : '✓';\n  b.className = e ? 'er' : w ? 'wr' : 'ok';\n  paintGutter();\n  if (!$('ov').hidden) drawOv();\n}\nfunction drawOv() {\n  document.querySelectorAll('.ovh [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === ovTab));\n  const box = $('ovb');\n  if (ovTab === 'lint') {\n    const lines = ed.value.split('\\n');\n    box.innerHTML = (issues.length\n      ? issues.map(x => '\u003cbutton class=\"is ' + x.lv + '\" data-no=\"' + x.no + '\">\u003cb>' + (x.lv === 'e' ? '✖ エラー' : '⚠ 注意') + '　' + x.no + '行目\u003c/b>\u003cspan>' + esc(x.msg) + '\u003c/span>\u003ccode>' + esc((lines[x.no - 1] || '').trim().slice(0, 60)) + '\u003c/code>\u003c/button>').join('')\n      : '\u003cp class=\"okm\">✓ 問題は見つかりませんでした\u003c/p>') +\n      '\u003cp class=\"note\">簡易チェックです。ゲーム本体の判定と完全には一致しません。タップでその行へ移動します。\u003c/p>';\n  } else {\n    let svg = '';\n    try { svg = SS.flowSVG(ed.value); }\n    catch (err) { box.innerHTML = '\u003cp class=\"note\">フロー図の生成でエラー: ' + esc(err && err.message || err) + '\u003c/p>'; return; }\n    box.innerHTML = svg ? '\u003cp class=\"note\">上から順に毎フレーム実行されます。ノードをタップするとその行へ移動します。\u003c/p>' + svg : '\u003cp class=\"note\">スクリプトが空です\u003c/p>';\n  }\n}\nfunction openOv(tab) { ovTab = tab; ed.blur(); $('ov').hidden = false; drawOv(); }\nfunction closeOv() { $('ov').hidden = true; }\nfunction jump(no) {\n  const lines = ed.value.split('\\n'); let off = 0;\n  for (let i = 0; i \u003c no - 1 && i \u003c lines.length; i++) off += lines[i].length + 1;\n  closeOv(); ed.focus(); ed.setSelectionRange(off, off + (lines[no - 1] || '').length);\n  ed.scrollTop = Math.max(0, (no - 4) * 24); sync(); status();\n}\n\n$('blint').addEventListener('click', () => openOv('lint'));\n$('bflow').addEventListener('click', () => openOv('flow'));\n$('ovx').addEventListener('click', closeOv);\n$('ov').addEventListener('click', e => {\n  const t = e.target.closest('[data-tab]');\n  if (t) { ovTab = t.dataset.tab; drawOv(); return; }\n  const n = e.target.closest('[data-no]');\n  if (n) jump(+n.dataset.no);\n});\ned.addEventListener('input', () => { clearTimeout(lintTimer); lintTimer = setTimeout(runLint, 350); });\nrunLint();\nwindow.__t = { lint: SS.lint, flowSVG: SS.flowSVG };   // ブラウザのコンソールから __t.lint('...') で試せる\n})();\n", "tests.js": "/* ============================================================\n   tests.js — 構文チェックの回帰テスト（test.html で実行）\n   ------------------------------------------------------------\n   形式: { name: \"説明\", code: \"チェックするコード\", expect: [[行番号, \"e\"|\"w\"], ...] }\n     expect が [] なら「何も指摘されないこと」を確認します。\n   ルールを足したら、ここにも1件足しておくと、あとで他のルールを直したときに\n   うっかり壊していないか test.html ですぐ確認できます。\n   ============================================================ */\nwindow.SS_TESTS = [\n  { name: \"正常: ?と:の基本\", code: \"?hp \u003c 10\\n  equipR vigor shield\\n:\\n  loadout 1\", expect: [] },\n  { name: \"正常: :? の連鎖\", code: \"?a = 1\\n  x = 1\\n:?a = 2\\n  x = 2\\n:\\n  x = 3\", expect: [] },\n  { name: \"正常: ^ 継続行\", code: \"?a = 1 &\\n^ b = 2\\n  x = 1\", expect: [] },\n  { name: \"正常: コメントのみ\", code: \"// コメントだけ\\n/* ブロック */\", expect: [] },\n  { name: \"正常: >表示\", code: \">`0,1,HP = @hp@/@maxhp@\", expect: [] },\n  { name: \"if/else を使った\", code: \"if hp \u003c 10\\n  x = 1\\nelse\\n  x = 2\", expect: [[1,\"e\"],[2,\"e\"],[3,\"e\"],[4,\"e\"]] },\n  { name: \"== を使った\", code: \"?a == 1\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"&& || を使った\", code: \"?a = 1 && b = 2\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"!= を使った（注意）\", code: \"?a != 1\\n  x = 1\", expect: [[1,\"w\"]] },\n  { name: \"and/or を使った（注意）\", code: \"?a = 1 and b = 2\\n  x = 1\", expect: [[1,\"w\"]] },\n  { name: \"条件が & で終わる\", code: \"?a = 1 &\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"条件が空\", code: \"?\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"対応する ? が無い :\", code: \"x = 1\\n:\\n  y = 2\", expect: [[2,\"e\"]] },\n  { name: \": の後ろに文字\", code: \"?a = 1\\n  x = 1\\n:foo\", expect: [[3,\"e\"]] },\n  { name: \"中身が無い（注意）\", code: \"?a = 1\\n:\\n  x = 1\", expect: [[1,\"w\"]] },\n  { name: \"インデントが深すぎる\", code: \"x = 1\\n  y = 2\", expect: [[2,\"e\"]] },\n  { name: \"インデントが揃わない（注意）\", code: \"?a = 1\\n    x = 1\\n  y = 2\", expect: [[3,\"w\"]] },\n  { name: \"タブと空白の混在（注意）\", code: \"?a = 1\\n \\tx = 1\", expect: [[2,\"w\"]] },\n  { name: \"先頭行の ^\", code: \"^ a\", expect: [[1,\"e\"]] },\n  { name: \"/* が閉じていない\", code: \"/* ひらきっぱなし\\nx = 1\", expect: [[1,\"e\"]] },\n  { name: \"ascii が閉じていない\", code: \"a = ascii\\n  art\", expect: [[1,\"e\"]] },\n  { name: \"括弧の対応\", code: \"var a = (1 + 2\", expect: [[1,\"e\"]] },\n  { name: \"\\\" が閉じていない\", code: \"var a = \\\"abc\", expect: [[1,\"e\"]] },\n  { name: \"var の書き方\", code: \"var 1a\", expect: [[1,\"e\"]] },\n  { name: \"import の引数なし\", code: \"import\", expect: [[1,\"e\"]] },\n  { name: \"equip の引数なし\", code: \"equipR\", expect: [[1,\"e\"]] },\n  { name: \"loadout の後ろ（注意）\", code: \"loadout abc\", expect: [[1,\"w\"]] },\n  { name: \"equip の条件が多すぎ（注意）\", code: \"equip a b c d e f g h\", expect: [[1,\"w\"]] },\n  { name: \"disable の対象不明（注意）\", code: \"disable foo\", expect: [[1,\"w\"]] },\n  { name: \"func の書き方\", code: \"func bad\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"for の書き方\", code: \"for i 1 5\\n  x = 1\", expect: [[1,\"e\"]] },\n  { name: \"行末の ; （注意）\", code: \"x = 1;\", expect: [[1,\"w\"]] },\n  { name: \"もしかして（注意）\", code: \"equpR vigor\", expect: [[1,\"w\"]] },\n  { name: \"@ が奇数\", code: \">`0,1,HP = @hp\", expect: [[1,\"e\"]] },\n  { name: \">` の X,Y 不足（注意）\", code: \">`0 text\", expect: [[1,\"w\"]] },\n  { name: \"未知の他言語（let）\", code: \"let a = 1\", expect: [[1,\"e\"]] },\n  { name: \"while\", code: \"while a\\n  x = 1\", expect: [[1,\"e\"],[2,\"e\"]] },\n  { name: \"end（終了記号は不要）\", code: \"?a = 1\\n  x = 1\\nend\", expect: [[3,\"e\"]] },\n\n  /* ▼ 自分のルール用のテストはここに追加（custom-rules.js を有効にした状態で判定されます） */\n];\n", "test.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>構文チェック テスト\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark}\nbody{margin:0;padding:12px;background:#16171a;color:#d9d5cc;font:14px/1.6 -apple-system,\"Hiragino Sans\",system-ui,sans-serif}\nh1{font-size:17px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 6px}\na{color:#e3a857}.sum{padding:8px 12px;border-radius:8px;margin:8px 0;font-weight:700}\n.sum.ok{background:#1d2b1d;color:#98c379}.sum.ng{background:#2e1c1e;color:#e06c75}\n.row{border-bottom:1px solid #2c2f35;padding:6px 0}.row b.ok{color:#98c379}.row b.ng{color:#e06c75}\npre{margin:4px 0 0;background:#121316;border:1px solid #2c2f35;border-radius:6px;padding:6px 8px;font:12px/1.5 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre-wrap}\ntextarea{width:100%;min-height:140px;box-sizing:border-box;background:#121316;color:#d9d5cc;border:1px solid #2c2f35;border-radius:6px;padding:8px;font:16px/1.5 ui-monospace,Menlo,monospace}\nbutton{font:inherit;background:#25282d;color:inherit;border:1px solid #2c2f35;border-radius:8px;padding:6px 14px}\n.is{padding:6px 0;border-bottom:1px solid #2c2f35}.e{color:#e06c75}.w{color:#e5c07b}\n.mute{color:#8a8f98;font-size:12px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>構文チェック テスト\u003c/h1>\n\u003cp class=\"mute\">\u003ca href=\"./\">← エディタへ\u003c/a>　／　\u003cspan id=\"mode\">\u003c/span>\u003c/p>\n\u003cdiv id=\"sum\">\u003c/div>\n\u003cdiv id=\"res\">\u003c/div>\n\n\u003ch2>その場で試す\u003c/h2>\n\u003ctextarea id=\"try\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\">?hp \u003c 10 &&\n  equipR vigor shield\n:\n  loadout 1\u003c/textarea>\n\u003cp>\u003cbutton id=\"go\">チェック\u003c/button>\u003c/p>\n\u003cdiv id=\"out\">\u003c/div>\n\n\u003c!-- 読み込み順: lint → flow → custom-rules → tests -->\n\u003cscript src=\"lint.js\">\u003c/script>\n\u003cscript src=\"flow.js\">\u003c/script>\n\u003cscript>\n// ?builtin を付けて開くと GUI登録・custom-rules.js を読み込まず、組み込みルールだけを検証します\nvar builtinOnly = /[?&]builtin/.test(location.search);\nif (!builtinOnly) document.write('\u003cscript src=\"gui-rules.js\">\u003c\\/script>\u003cscript src=\"custom-rules.js\">\u003c\\/script>');\n\u003c/script>\n\u003cscript src=\"tests.js\">\u003c/script>\n\u003cscript>\n(function () {\n  var SS = window.SS, esc = function (s) { return String(s).replace(/[&\u003c>]/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;' }[c]; }); };\n  document.getElementById('mode').innerHTML = builtinOnly\n    ? '組み込みルールのみ（\u003ca href=\"test.html\">GUI登録・custom-rules.js も含める\u003c/a>）'\n    : 'GUI登録・custom-rules.js を含む（\u003ca href=\"test.html?builtin=1\">組み込みのみで試す\u003c/a>）';\n  var fmt = function (a) { return a.length ? a.map(function (x) { return x[0] + '行' + (x[1] === 'e' ? 'エラー' : '注意'); }).join(' / ') : '指摘なし'; };\n  var ng = 0, html = '';\n  (window.SS_TESTS || []).forEach(function (t) {\n    var got, msg = '';\n    try { var r = SS.lint(t.code); got = r.map(function (x) { return [x.no, x.lv]; }); msg = r.map(function (x) { return x.no + '行: ' + x.msg; }).join('\\n'); }\n    catch (e) { got = [['ERR', String(e)]]; }\n    var ok = JSON.stringify(got) === JSON.stringify(t.expect);\n    if (!ok) ng++;\n    html += '\u003cdiv class=\"row\">\u003cb class=\"' + (ok ? 'ok' : 'ng') + '\">' + (ok ? '✓' : '✗') + '\u003c/b> ' + esc(t.name) +\n      (ok ? '' : '\u003cdiv class=\"mute\">期待: ' + esc(fmt(t.expect)) + '　実際: ' + esc(fmt(got)) + '\u003c/div>\u003cpre>' + esc(t.code) + '\u003c/pre>\u003cpre>' + esc(msg) + '\u003c/pre>') + '\u003c/div>';\n  });\n  var n = (window.SS_TESTS || []).length;\n  document.getElementById('sum').innerHTML = '\u003cdiv class=\"sum ' + (ng ? 'ng' : 'ok') + '\">' + (ng ? '✗ ' + ng + ' 件失敗 / ' + n + ' 件' : '✓ ' + n + ' 件すべて成功') + '\u003c/div>';\n  document.getElementById('res').innerHTML = html;\n\n  document.getElementById('go').onclick = function () {\n    var src = document.getElementById('try').value, r = SS.lint(src), lines = src.split('\\n');\n    document.getElementById('out').innerHTML = r.length ? r.map(function (x) {\n      return '\u003cdiv class=\"is\">\u003cspan class=\"' + x.lv + '\">' + (x.lv === 'e' ? '✖ エラー' : '⚠ 注意') + ' ' + x.no + '行目\u003c/span>\u003cbr>' + esc(x.msg) + '\u003cbr>\u003cspan class=\"mute\">' + esc((lines[x.no - 1] || '').trim()) + '\u003c/span>\u003c/div>';\n    }).join('') : '\u003cdiv class=\"sum ok\">✓ 問題なし\u003c/div>';\n  };\n  document.getElementById('go').onclick();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "README.md": "# Stone Script Editor 改修ガイド\n\n構文チェック・フロー図を **自分で追加・修正する** ための手引きです。\n（攻略サイトエディタからダウンロードした ZIP の `editor/` フォルダにこのファイルが入っています）\n\n- 公式マニュアル: https://stonestoryrpg.com/stonescript/manual.html\n- 組み込みのチェックは「簡易チェック」です。ゲーム本体の判定と完全には一致しません。食い違いを見つけたら、このガイドの方法でルールを直してください。\n\n---\n\n## 1. ファイル構成\n\n| ファイル | 役割 | 触る頻度 |\n|---|---|---|\n| `index.html` | 画面の骨組み。`\u003cscript>` の**読み込み順**がここで決まる | ほぼ無し |\n| `editor.css` | 見た目（色・サイズ・チェック画面） | 見た目を変えるとき |\n| `snippets.js` | 補完候補（`const snippets = [...]`）。**このファイルだけ差し替えればOK** | スニペット更新時 |\n| `core.js` | エディタ本体（ハイライト・補完・キー操作・コピー/クリア） | ほぼ無し |\n| `lint.js` | **構文チェック**（解析＋組み込みルール＋拡張ポイント） | ルールを根本から直すとき |\n| `flow.js` | **フロー図**（木構造化→配置→SVG。見た目の設定テーブル付き） | 図の構造を変えるとき |\n| `gui-snippets.js` / `gui-rules.js` | **攻略サイトエディタの「登録（GUI）」から自動生成**（手で編集しても次回の出力で上書き） | 触らない |\n| `custom-rules.js` | **自分用のルール置き場**（lint.js / flow.js の後に読み込まれる） | **いちばんよく触る** |\n| `ui.js` | 「✓」ボタン・チェック一覧・フロー図の画面・行番号の色付け | 画面を変えるとき |\n| `tests.js` / `test.html` | 構文チェックの回帰テスト（`test.html` をブラウザで開くだけ） | ルールを足したとき |\n\n読み込み順（`index.html`）: `snippets → gui-snippets → core → lint → flow → gui-rules → custom-rules → ui`\n`custom-rules.js` が `lint.js` / `flow.js` より前だと `SS` が無くてエラーになります。\n\n> **基本方針**: まず `custom-rules.js` に書く。それで足りないときだけ `lint.js` / `flow.js` を直接直す。\n> こうしておくと、将来エディタ本体を差し替えても自分のルールが残ります。\n\n---\n\n## 2. 仕組み（全体の流れ）\n\n```\n テキスト\n   │  logicalLines()   … コメント除去 / 「^」継続行の結合 / ascii〜asciiend を無視\n   ▼\n 論理行  [{ no, ind, mixed, text }, ...]\n   │\n   ├─ lint()      … 1行ずつ checkLine → 自作の行ルール → 最後に自作のファイルルール\n   │     └→ 指摘 [{ no, lv:'e'|'w', msg }, ...] → ui.js が ✖/⚠ ボタンと一覧、行番号の色に反映\n   │\n   └─ flowSVG()   … buildTree(木構造) → seq / stack / rowNode(配置) → SVG文字列 → ui.js が表示\n```\n\n**論理行**（ルールが受け取る行）の中身:\n\n| 項目 | 内容 |\n|---|---|\n| `no` | 元テキストの行番号（1始まり）。指摘はこの番号で表示される |\n| `ind` | インデント幅（タブは空白2個として数える） |\n| `mixed` | インデントにタブと空白が混在しているか |\n| `text` | コメント除去済み・前後の空白なし。`^` で続けた行は半角スペースで1行に結合済み |\n\n`lineKind(text)` が行の種類を返します: `'if'`（`?…`）/ `'elif'`（`:?…`）/ `'else'`（`:` だけ）/ `'func'` / `'for'` / `'stmt'`（それ以外）\n\n---\n\n## 3. やりたいこと → 触る場所\n\n| やりたいこと | 方法 | 場所 |\n|---|---|---|\n| 他言語の書き方（`switch` など）にヒントを出したい | `WRONG_WORDS` に単語、`HINT` に文言を追加 | `custom-rules.js` |\n| 新しいコマンドを「不明な書き方」にしたくない | `addStmtHandler`（§4-C） | `custom-rules.js` |\n| 「もしかして」候補にコマンドを足したい | `SS.CMDS.push('名前')` | `custom-rules.js` |\n| `disable` / `enable` の対象を増やしたい | `SS.DISABLE_TARGETS` に `\\|対象` を足す | `custom-rules.js` |\n| 独自のチェックを足したい（1行単位） | `addLineRule`（§4-A） | `custom-rules.js` |\n| 独自のチェックを足したい（ファイル全体） | `addFileRule`（§4-B） | `custom-rules.js` |\n| 既存ルールの文言を直したい | `lint.js` の該当行を検索して書き換え | `lint.js` |\n| 新しいブロック構文を追加したい | §5 | `lint.js` + `flow.js` |\n| フロー図の色・文字数・ラベルを変えたい | §6 | `custom-rules.js` |\n\n---\n\n## 4. 構文チェックにルールを足す\n\n指摘は `'e'`（エラー・赤）か `'w'`（注意・黄）。ボタンの数字・行番号の色・一覧に反映されます。\n\n### A. 行ルール（1行ごとに呼ばれる）\n\n```js\nSS.addLineRule(ctx => {\n  const m = ctx.text.match(/^var\\s+([A-Za-z_])\\b/);\n  if (m) ctx.add('w', '変数名「' + m[1] + '」は短すぎます');\n});\n```\n\n`ctx` の中身:\n\n| 名前 | 内容 |\n|---|---|\n| `ctx.text` / `ctx.no` / `ctx.indent` | 行のテキスト / 行番号 / インデント幅 |\n| `ctx.kind` | `'if'` `'elif'` `'else'` `'func'` `'for'` `'stmt'` |\n| `ctx.prev` / `ctx.next` | 前後の論理行（無ければ `undefined`） |\n| `ctx.lines` / `ctx.index` | 全論理行 / 自分の位置 |\n| `ctx.add(lv, msg)` | この行に指摘を追加（第3引数に行番号を渡すと別の行にも付けられる） |\n| `ctx.bal(文字列)` | 引用符・カッコの対応チェック（省略時はこの行全体） |\n\n組み込みチェックが途中で終わった行（`if` を使った間違い行など）でも、行ルールは**必ず呼ばれます**。\n`ctx.kind === 'stmt'` で「通常の文だけ」に絞るのがコツです。\n\n### B. ファイルルール（全行を見終わってから1回）\n\n```js\nSS.addFileRule(ctx => {\n  const seen = {};\n  ctx.lines.forEach(l => {\n    const m = l.ind === 0 && l.text.match(/^var\\s+([A-Za-z_]\\w*)/);\n    if (!m) return;\n    if (seen[m[1]]) ctx.add(l.no, 'w', '「' + m[1] + '」は ' + seen[m[1]] + ' 行目で宣言済みです');\n    else seen[m[1]] = l.no;\n  });\n});\n```\n\n`ctx.lines`（論理行）, `ctx.src`（元のテキスト）, `ctx.issues`（ここまでの指摘）, `ctx.add(行番号, lv, msg)`, `ctx.bal(文字列, 行番号)`\n\n「呼ばれているのに宣言されていない関数」「`import` が先頭にない」など、**行をまたぐチェック**はこちらです。\n\n### C. 文ハンドラ（新コマンドを「既知」にする）\n\n通常の文でどの書き方にも当てはまらないと「不明な書き方です」が出ます。\nハンドラが `true` を返すと、その文は「既知」とみなされ、警告が出なくなります。\n\n```js\nSS.CMDS.push('shout');                       // 「もしかして」の候補にも入れる\nSS.addStmtHandler((t, ctx) => {              // t = 文のテキスト\n  if (!/^shout\\b/.test(t)) return false;     // 自分の担当でなければ false\n  if (!/^shout\\s+\\S/.test(t)) ctx.add('e', 'shout の後に文字が必要です');\n  return true;\n});\n```\n\n### D. 設定テーブルを書き換える（コードを書かずに済む調整）\n\n```js\nSS.WRONG_WORDS.push('switch');                              // 文頭に来たら間違い\nSS.HINT.switch = 'switch はありません。「?」と「:?」で書きます';  // 出すメッセージ（キーは小文字）\nSS.DISABLE_TARGETS += '|newTarget';                         // disable/enable の対象を追加\n```\n\n### 書くときの注意\n\n- **コメントや `^` は処理済み**です。`ctx.text` にコメントは残っていません。コメントそのものを検査したいときは `ctx.src`（ファイルルール）から元の行を読みます。\n- **行番号は元の行**です（空行・コメント行も数えた番号）。`ascii` 〜 `asciiend` の中身は論理行に含まれません。\n- 正規表現は**行頭 `^` と行末 `$`** で固定すると誤検出が減ります。\n- 自作ルールが例外を出しても、エディタは止まりません。チェック一覧の1行目に `[custom-rules.js] … でエラー` と出るので、メッセージを見て直してください。\n- 誤検出（正しいコードに警告）は `'e'` より `'w'` にしておくと安全です。\n\n---\n\n## 5. 新しいブロック構文を追加する（例: `while 条件`）\n\n`?` `:?` `:` `func` `for` のように「次の行以降をインデントして中身を書く」構文が増えたときの手順です。\n\n1. **`lint.js` の `lineKind`** に種類を追加\n   ```js\n   : /^while\\b/.test(t) ? 'while'\n   ```\n2. **`lint.js` の `checkLine`**\n   - `const opener = [...]` の配列に `'while'` を足す（中身が無い警告・インデント深すぎ判定に効く）\n   - 書き方チェックの分岐に追加:\n     ```js\n     } else if (k === 'while') {\n       if (!/^while\\s+.+$/.test(t)) add(no, 'e', 'while の書き方: while 条件');\n     ```\n   - `WRONG_WORDS` と `HINT` から `while` を消す（もう間違いではないので）\n3. **`flow.js` の `buildTree`** の `k === 'func' || k === 'for'` に `|| k === 'while'`\n4. **`flow.js` の `colors`** に `while: '#xxxxxx'`（枠線の色。無いと色が未指定になる）\n5. `tests.js` にケースを足して `test.html` で確認\n\n分岐のように「条件が真/偽で2方向に分かれる図」にしたい場合は、`buildTree` の `chain` と `seq` の\n`it.t === 'chain'` の分岐を参考に、新しい `t:` の種類を作ります。\n\n---\n\n## 6. フロー図の見た目を変える\n\n`custom-rules.js`（または `flow.js` の先頭）で設定します。\n\n```js\nSS.flow.cfg.yes = 'YES';              // 「はい」ラベル\nSS.flow.cfg.stmtCols = 50;            // 文を何文字まで表示するか（半角換算）\nSS.flow.cfg.stmtLimit = 12;           // 連続する文が何行を超えたら省略するか\nSS.flow.cfg.stmtShow = 10;            // 省略するとき何行見せるか\nSS.flow.colors.func = '#ff9900';      // ノード枠線の色（if / elif / else / for / func / start）\nSS.flow.stmtColors.unshift([/^(disable|enable)\\b/, '#e06c75']);   // 文の色（上から最初に一致したもの）\nSS.flow.stmtText = t => t.replace(/^var\\s+/, '');                 // 表示テキストの加工\n```\n\n主な設定値（`SS.flow.cfg`）: `GAP`（縦の間隔）/ `ARW`（横の矢印の長さ）/ `condCols`（条件の折り返し幅）/\n`condMaxLines`（条件の最大行数）/ `headCols`（func・for 見出しの幅）/ `startText`（開始ノードの文言）/ `no`（「いいえ」）/ `elseText`\n\n---\n\n## 7. 動作確認の方法\n\n### test.html（おすすめ・iPhone でもOK）\n`editor/test.html` を開くと、`tests.js` の全ケースを実行して ✓ / ✗ を表示します。\n- 上部の「組み込みのみで試す」で、`custom-rules.js` を外した状態も確認できます。\n- ページ下部の欄に1行書いて「チェック」を押すと、その場で指摘を確認できます。\n- ルールを足したら `tests.js` にケースを1件足す → あとで別のルールを直しても壊れていないか一目で分かります。\n\n形式: `{ name: \"説明\", code: \"テキスト\", expect: [[行番号, 'e'|'w'], ...] }`（`[]` は「指摘なし」を期待）\n\n### ブラウザのコンソール（PC）\nエディタを開いて `__t.lint('?a == 1\\n  x')` や `__t.flowSVG('...')` を実行できます。\n\n### サンプルで動作を見る\n`custom-rules.js` の `ENABLE_SAMPLES` を `true` にすると、サンプルルールが有効になります（試したら `false` に戻す）。\n\n---\n\n## 8. つまずいたとき\n\n| 症状 | 原因・対処 |\n|---|---|\n| 直したのに反映されない（特に iPhone） | ブラウザのキャッシュ。`index.html` の `\u003cscript src=\"lint.js?v=2\">` のように数字を変える／タブを閉じて開き直す |\n| 画面が真っ白・ボタンが出ない | どれかの `.js` に構文エラー。`test.html` を開くと原因が分かりやすい／カッコの閉じ忘れを確認 |\n| `SS is not defined` | `custom-rules.js` が `lint.js` より前に読み込まれている。`index.html` の順序を確認 |\n| 自作ルールで警告が1行目に出る | `[custom-rules.js] … でエラー` はルール内の例外。メッセージの内容を修正 |\n| 正しいコードに警告が出る | 誤検出。`WRONG_WORDS` / 正規表現を直すか、そのルールを `'w'` に下げる |\n| フロー図のノードがずれる | 文字幅の計算は `FW`（半角1文字=7.2px）の概算。極端に長い行は `stmtCols` を調整 |\n\n---\n\n## 9. スニペット（補完候補）を更新する\n\n- `snippets.js` の `const snippets = [...]` を丸ごと差し替えれば反映されます。\n- 攻略サイトエディタの「snippets.js を読込」、または「Script Editor のファイル」欄で直接編集すると、ZIP を出力するたびに同梱されます。\n- 1件の形式: `{ key: \".名前\", insert: \"名前($1)\", desc: \" 戻り値:型\\n説明\\n\\n サンプルコード\" }`\n  `$1` は挿入後のカーソル位置、`insert` は関数にもできます（日付付きコメントの例を参照）。\n\n---\n\n## 10. 攻略サイトエディタ側で、記事とエディタをまとめて編集・保存する\n\n### GUI で登録する（コードを書かない方法）\n攻略サイトエディタの「Script Editor の登録（GUI）」に入力するだけで、次のものを追加できます。\n\n| 項目 | できること |\n|---|---|\n| 単語・スニペットを登録 | 補完候補を追加（キー・挿入内容・戻り値・説明・サンプルコード） |\n| 使えるコマンド（単語） | 「不明な書き方です」を出さない／「もしかして」候補に入れる（引数の必須チェック付き） |\n| 間違い単語のヒント | 行頭にあったらエラーにして、好きなメッセージを出す |\n| 禁止パターン | 行に含まれていたら指摘（テキスト or 正規表現、エラー/注意を選べる） |\n| disable / enable の対象 | 使える対象の言葉を追加 |\n| フロー図の文の色・ラベル | 行頭の単語ごとの文字色、「はい/いいえ」ラベル |\n\n入力内容は `gui-snippets.js` と `gui-rules.js` として自動生成され、ZIP に入ります。\n複雑な判定（行をまたぐチェックなど）が必要なときだけ、§4 の `custom-rules.js` を使ってください。\n\n### ファイルを直接編集する（上級者向け）\n\n攻略サイトエディタの下部「Script Editor のファイル」欄から、この `editor/` 内の全ファイル\n（`snippets.js` / `custom-rules.js` / `lint.js` / `flow.js` / `core.js` / `ui.js` / `editor.css` など）を直接編集できます。\n\n- 右側の **「Script Editor（試用）」** で、編集内容が反映されたエディタをその場で操作できます（構文エラーは欄の下に表示）。\n- 変更したファイルには選択欄で「●」が付きます。「このファイルを初期値に戻す」で元に戻せます。\n- **プロジェクト保存**: 記事＋エディタ側の変更を `stone-guide-project.json` に保存。**プロジェクト読込**で丸ごと復元します。\n- ZIP の直下にも `project.json` が入るので、展開したフォルダからでも読み込めます（公開したくない場合は、公開前に削除してください）。\n- ZIP を展開して手で直したファイルは、「Script Editor のファイル」欄に貼り付けて取り込んでください（そうしないと次回の ZIP で元に戻ります）。\n"}</script>
<script>
const KEY="stone-guide-draft-v1";
const LBL={h3:"小見出し",text:"解説文",code:"コードブロック",note:"ポイント"};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>");
const DEF={title:"Stone Script 攻略ガイド",sub:"Stone Story RPG のスクリプトを学ぶ",foot:"非公式ファンサイト",accent:"#e0a94a",bundle:true,sections:[
{title:"はじめに",blocks:[{type:"text",text:"ここに解説文を書きます。`インラインコード`はバッククォートで囲みます。\n\n空行を入れると段落が分かれます。"},{type:"code",title:"sample.txt",text:"// サンプルコード（書き換えてください）\nline 2\nline 3"},{type:"note",text:"ポイントや注意点はこのボックスに書けます。"}]},
{title:"基本の書き方",blocks:[{type:"h3",text:"小見出し"},{type:"text",text:"解説文を追加・削除・並べ替えできます。"},{type:"code",title:"",text:"// コードブロックは何個でも置けます"}]}]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.sections)S=JSON.parse(JSON.stringify(DEF));
if(S.bundle===undefined)S.bundle=true;

function blockHTML(b,bundle){
 if(b.type==="h3")return `<h3>${inl(b.text)}</h3>`;
 if(b.type==="text")return b.text.split(/\n{2,}/).filter(p=>p.trim()).map(p=>`<p>${inl(p).replace(/\n/g,"<br>")}</p>`).join("");
 if(b.type==="note")return `<aside class="note">${inl(b.text).replace(/\n/g,"<br>")}</aside>`;
 const ls=b.text.replace(/\n+$/,"").split("\n");
 return `<figure class="code"><div class="bar"><span>${esc(b.title||"")}</span><span class="acts">${bundle?'<button class="open" type="button">エディタで開く</button>':""}<button class="copy" type="button">コピー</button></span></div><pre data-code="${esc(b.text)}"><code>${ls.map(l=>`<span class="l">${esc(l)||" "}</span>`).join("")}</code></pre></figure>`;
}
function gen(s,preview){
 const css=`:root{--bg:#1d2127;--pn:#272d35;--tx:#dde2e8;--mu:#8b95a3;--ln:#3a424d;--ac:${esc(s.accent)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.85 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.top{padding:40px 20px 24px;max-width:760px;margin:auto}h1{font-size:clamp(26px,6vw,38px);line-height:1.3;margin:0 0 8px}.top p{color:var(--mu);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;white-space:nowrap}
nav a{color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:6px;font-size:14px}nav a:hover{color:var(--ac)}
main{max-width:760px;margin:auto;padding:0 20px 60px}section{padding-top:36px;scroll-margin-top:50px}
h2{font-size:22px;margin:0 0 16px;padding-left:12px;border-left:4px solid var(--ac)}h3{font-size:17px;margin:28px 0 8px;color:var(--ac)}p{margin:0 0 14px}
code{font-family:ui-monospace,Menlo,Consolas,monospace}p code,.note code{background:var(--pn);padding:1px 6px;border-radius:4px;font-size:.9em}
.note{background:var(--pn);border-left:4px solid var(--ac);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:15px}
.code{margin:16px 0;background:#14171b;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:var(--pn);color:var(--mu);font-size:13px;min-height:40px}
.acts{display:flex;gap:6px}.copy,.open{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer}.copy:hover,.open:hover{border-color:var(--ac);color:var(--ac)}nav a.ed{color:var(--ac);font-weight:700}
pre{margin:0;padding:12px 0;overflow-x:auto;counter-reset:n;font-size:14px;line-height:1.6}
.l{display:block;white-space:pre;padding-right:16px;min-width:max-content}
.l::before{counter-increment:n;content:counter(n);display:inline-block;width:2.6em;margin-right:14px;text-align:right;color:#5d6775;user-select:none;-webkit-user-select:none}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}`;
 const nav=s.sections.map((x,i)=>`<a href="#s${i}">${esc(x.title)}</a>`).join("")+(s.bundle?`<a class="ed" href="${preview?"#":"editor/index.html"}">Script Editor</a>`:"");
 const main=s.sections.map((x,i)=>`<section id="s${i}"><h2>${esc(x.title)}</h2>${x.blocks.map(b=>blockHTML(b,s.bundle)).join("")}</section>`).join("");
 const js=`document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const t=b.closest('figure').querySelector('pre').dataset.code;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}b.textContent='コピー済み';setTimeout(()=>b.textContent='コピー',1500)});
document.querySelectorAll('.open').forEach(b=>b.onclick=()=>{const t=b.closest('figure').querySelector('pre').dataset.code;if(!/^(https?|file):$/.test(location.protocol)){alert('プレビューでは開けません。ダウンロードしたサイトで使えます');return}location.href='editor/index.html#code='+encodeURIComponent(t)});`;
 const data=JSON.stringify(s).replace(/</g,"\\u003c");
 return `<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${esc(s.title)}</title>\n<style>\n${css}\n</style>\n</head>\n<body>\n<header class="top"><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></header>\n<nav>${nav}</nav>\n<main>\n${main}\n</main>\n<footer>${esc(s.foot)}</footer>\n<script type="application/json" id="site-data">${data}<\/script>\n<script>\n${js}\n<\/script>\n</body>\n</html>`;
}

const $=id=>document.getElementById(id);
function render(){
 let h=`<p class="hint">解説文は空行で段落分け、<code>\`</code>で囲むとインラインコードになります。</p><div class="card"><label>サイトタイトル<input data-p="title" value="${esc(S.title)}"></label><label>サブタイトル<input data-p="sub" value="${esc(S.sub)}"></label><label>フッター<input data-p="foot" value="${esc(S.foot)}"></label><label>アクセントカラー<br><input type="color" data-p="accent" value="${esc(S.accent)}"></label><label class="chk"><input type="checkbox" data-p="bundle"${S.bundle?" checked":""}>Script Editorを同梱する（ZIPでダウンロード）</label><div class="sub"><div class="row"><button data-a="snip">snippets.jsを読込</button><button data-a="snipx">サンプルに戻す</button></div><p class="hint" id="snipst"></p><p class="hint">補完スニペット（const snippets = [ ... ];）のファイルを渡すと、同梱するScript Editorに反映されます。</p></div></div>`;
 S.sections.forEach((sec,i)=>{
  h+=`<div class="card sec"><div class="row"><input class="st" data-p="sections.${i}.title" value="${esc(sec.title)}"><button data-a="sup" data-i="${i}">↑</button><button data-a="sdn" data-i="${i}">↓</button><button data-a="sdel" data-i="${i}">削除</button></div>`;
  sec.blocks.forEach((b,j)=>{
   const p=`sections.${i}.blocks.${j}`;
   h+=`<div class="blk"><div class="row"><b>${LBL[b.type]}</b>${b.type==="code"?`<input data-p="${p}.title" placeholder="ファイル名など" value="${esc(b.title||"")}">`:`<span class="sp"></span>`}<button data-a="bup" data-i="${i}" data-j="${j}">↑</button><button data-a="bdn" data-i="${i}" data-j="${j}">↓</button><button data-a="bdel" data-i="${i}" data-j="${j}">✕</button></div><textarea class="${b.type==="code"?"code":""}" data-p="${p}.text" rows="${b.type==="h3"?1:4}" spellcheck="false">${esc(b.text)}</textarea></div>`;
  });
  h+=`<div class="row add">追加：${Object.keys(LBL).map(t=>`<button data-a="add" data-i="${i}" data-t="${t}">${LBL[t]}</button>`).join("")}</div></div>`;
 });
 h+=`<button data-a="addsec" style="width:100%;padding:12px">＋ セクションを追加</button>`;
 h+=gHTML();
 h+=`<div class="card" style="margin-top:14px"><b>Script Editor のファイル（上級者向け）</b><p class="hint">スニペット・構文チェック・フロー図のルールなど、ZIPに入るエディタ側のファイルをここで直接編集できます。右の「Script Editor（試用）」でその場で動作を確認できます。</p><select id="fsel">${Object.keys(PKG).filter(n=>!GEN.includes(n)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select><textarea class="code" id="ftxt" data-f rows="14" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea><p class="hint" id="fst"></p><div class="row"><button data-a="frst">このファイルを初期値に戻す</button><button data-a="frall">すべて初期値に戻す</button></div></div>`;
 $("edit").innerHTML=h;snipStatus();fileUI();gStatus();
}
let tm;
function upd(now){localStorage.setItem(KEY,JSON.stringify(S));$("dl").textContent=S.bundle?"ZIPをダウンロード":"ダウンロード";clearTimeout(tm);tm=setTimeout(()=>{$("fr").srcdoc=gen(S,true)},now?0:350)}
function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",2600)}
const mv=(a,i,d)=>{const j=i+d;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]]};
document.addEventListener("input",e=>{if(e.target.dataset.g!==undefined){gSet(e.target);return}if(e.target.dataset.f!==undefined){setFile(curF,e.target.value);fileStatus();snipStatus();edRefresh();return}const p=e.target.dataset.p;if(!p)return;const k=p.split(".");let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=e.target.type==="checkbox"?e.target.checked:e.target.value;upd()});
document.addEventListener("click",e=>{
 const t=e.target.closest(".tabs [data-tab]");if(t){document.body.dataset.tab=t.dataset.tab;edRefresh(true);return}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
 if(a==="gadd"){G[b.dataset.t].push(GS[b.dataset.t].b());GO[b.dataset.t]=true;saveG();render();edRefresh(true);return}
 if(a==="gdel"){G[b.dataset.t].splice(i,1);saveG();render();edRefresh(true);return}
 if(a==="snip"){$("sfile").click();return}
 if(a==="frst"){delete EO[curF];saveEO();fileUI();snipStatus();edRefresh(true);msg("初期値に戻しました");return}
 if(a==="frall"){if(!confirm("エディタ側のファイルの変更をすべて初期値に戻しますか？"))return;EO={};saveEO();fileUI();snipStatus();edRefresh(true);return}
 if(a==="snipx"){delete EO["snippets.js"];saveEO();snipStatus();fileUI();edRefresh(true);msg("サンプルに戻しました");return}

const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function makeZip(files){
 const enc=new TextEncoder(),parts=[],cen=[],d=new Date();let off=0,csz=0;
 const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 files.forEach(f=>{
  const nm=enc.encode(f.name),da=enc.encode(f.data),crc=crc32(da),n=da.length;
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nm,da);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),nm);csz+=46+nm.length;off+=30+nm.length+n;
 });
 const end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csz,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:"application/zip"});
}

const GK="stone-guide-gui-v1",GEN=["gui-snippets.js","gui-rules.js"];
const GBLANK=()=>({snips:[],cmds:[],hints:[],pats:[],targets:[],colors:[],yes:"",no:""});
let G=GBLANK(),GO={};
function gClean(d){const o=GBLANK();if(d&&typeof d==="object")Object.keys(o).forEach(k=>{
 if(Array.isArray(o[k])&&Array.isArray(d[k]))o[k]=d[k].filter(x=>x&&typeof x==="object").map(x=>{const r={};Object.keys(x).forEach(f=>{if(typeof x[f]==="string"||typeof x[f]==="boolean")r[f]=x[f]});return r});
 else if(typeof o[k]==="string"&&typeof d[k]==="string")o[k]=d[k]});return o}
try{G=gClean(JSON.parse(localStorage.getItem(GK)))}catch(e){}
const saveG=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){msg("保存できませんでした（容量オーバーの可能性）")}};
const GS={
 snips:{t:"単語・スニペットを登録（補完候補に出る）",h:"例）キー「.myFunc」＝ドットの後に出る候補、キー「shout」＝単語の候補。挿入内容の「$1」は挿入後のカーソル位置です。",
  f:[["key","キー（例: .myFunc ／ shout）","text"],["insert","挿入内容（空ならキーと同じ。例: myFunc($1)）","text"],["ret","戻り値の型（任意。例: integer）","text"],["desc","説明","area"],["sample","サンプルコード（任意）","code"]],
  b:()=>({key:"",insert:"",ret:"",desc:"",sample:""}),l:x=>x.key},
 cmds:{t:"使えるコマンド（単語）を構文チェックに登録",h:"登録した単語で始まる行は「不明な書き方です」にならなくなり、「もしかして」の候補にも出ます。",
  f:[["name","コマンド名（英数字）","text"],["arg","引数","sel",[["none","なし／任意"],["req","必須（無いとエラー）"]]]],b:()=>({name:"",arg:"none"}),l:x=>x.name},
 hints:{t:"間違い単語のヒントを登録",h:"行頭にその単語があったらエラーにして、メッセージを出します。（例: switch → 「switch はありません。?と:? を使います」）",
  f:[["word","単語（英数字）","text"],["msg","表示するメッセージ","text"]],b:()=>({word:"",msg:""}),l:x=>x.word},
 pats:{t:"禁止パターンを登録（含まれていたら指摘）",h:"行にそのテキストが含まれていたら指摘します。コメントや ^ は処理済みの行に対して判定します。",
  f:[["pat","探すテキスト","text"],["re","正規表現として扱う","chk"],["lv","重大度","sel",[["w","注意（黄）"],["e","エラー（赤）"]]],["msg","表示するメッセージ","text"]],b:()=>({pat:"",re:false,lv:"w",msg:""}),l:x=>x.pat},
 targets:{t:"disable / enable の対象を登録",h:"「disable ○○」の○○に使える言葉を足します（例: hud foo）。",
  f:[["word","対象","text"]],b:()=>({word:""}),l:x=>x.word},
 colors:{t:"フロー図の文の色・ラベル",h:"行頭がその単語の文を、指定した色で表示します。",
  f:[["word","行頭の単語（英数字）","text"],["color","色","color"]],b:()=>({word:"",color:"#e06c75"}),l:x=>x.word}
};
function gErr(g,i){const x=G[g][i];if(!x)return"";
 if(g==="cmds"&&x.name&&!/^[A-Za-z_]\w*$/.test(x.name))return"⚠ 英数字と _ のみ使えます（無視されます）";
 if((g==="hints"||g==="colors")&&x.word&&!/^\w+$/.test(x.word))return"⚠ 英数字のみ使えます（無視されます）";
 if(g==="pats"&&x.re&&x.pat){try{new RegExp(x.pat)}catch(e){return"⚠ 正規表現が正しくありません（無視されます）"}}
 return""}
function gValid(g,i){const x=G[g][i];if(gErr(g,i))return false;
 if(g==="snips")return!!(x.key||"").trim();if(g==="cmds")return!!x.name;if(g==="hints")return!!(x.word&&x.msg);
 if(g==="pats")return!!(x.pat&&x.msg);if(g==="targets")return!!(x.word||"").trim();return!!(x.word&&x.color)}
function gStatus(){document.querySelectorAll("[data-ge]").forEach(el=>{const[g,i]=el.dataset.ge.split(".");el.textContent=gErr(g,+i)})}
function gHTML(){
 let h=`<div class="card" style="margin-top:14px"><b>Script Editor の登録（GUI）</b><p class="hint">フォームに入力するだけで、補完候補や構文チェックのルールを追加できます（gui-snippets.js / gui-rules.js が自動生成されます）。右の「Script Editor（試用）」ですぐ確認できます。</p>`;
 Object.keys(GS).forEach(g=>{const c=GS[g];
  h+=`<details class="gd" data-gd="${g}"${GO[g]?" open":""}><summary>${c.t}（${G[g].length}件）</summary><p class="hint">${c.h}</p>`;
  G[g].forEach((x,i)=>{
   h+=`<div class="blk"><div class="row"><b>${esc(c.l(x)||"（新規）")}</b><span class="sp"></span><button data-a="gdel" data-t="${g}" data-i="${i}">削除</button></div>`;
   c.f.forEach(([f,lab,ty,opt])=>{const at=`data-g="${g}.${i}.${f}"`,v=x[f]===undefined?"":x[f];
    if(ty==="chk")h+=`<label class="chk"><input type="checkbox" ${at}${v?" checked":""}>${lab}</label>`;
    else if(ty==="sel")h+=`<label>${lab}<select ${at}>${opt.map(o=>`<option value="${o[0]}"${v===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></label>`;
    else if(ty==="color")h+=`<label>${lab}<br><input type="color" ${at} value="${esc(v||"#e06c75")}"></label>`;
    else if(ty==="area"||ty==="code")h+=`<label>${lab}<textarea ${ty==="code"?'class="code" ':""}rows="${ty==="code"?4:2}" spellcheck="false" ${at}>${esc(v)}</textarea></label>`;
    else h+=`<label>${lab}<input ${at} value="${esc(v)}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>`});
   h+=`<p class="hint gerr" data-ge="${g}.${i}"></p></div>`});
  if(g==="colors")h+=`<label>「はい」ラベル（空なら初期値）<input data-g="yes" value="${esc(G.yes)}"></label><label>「いいえ」ラベル（空なら初期値）<input data-g="no" value="${esc(G.no)}"></label>`;
  h+=`<button data-a="gadd" data-t="${g}">＋ 追加</button></details>`});
 return h+"</div>"}
function genSnips(){
 const a=G.snips.filter((x,i)=>gValid("snips",i)).map(x=>{const k=x.key.trim();
  const d=(x.ret&&x.ret.trim()?" 戻り値:"+x.ret.trim()+"\n":"")+(x.desc||"").trim()+(x.sample&&x.sample.trim()?"\n\n "+x.sample.replace(/\s+$/,""):"");
  return{key:k,insert:x.insert&&x.insert.trim()?x.insert:(k[0]==="."?k.slice(1):k),desc:d}});
 return PKG["gui-snippets.js"].split("\n")[0]+"\n"+(a.length?"snippets.push(..."+JSON.stringify(a,null,1)+");\n":"")}
function genRules(){
 const v=g=>G[g].filter((x,i)=>gValid(g,i));
 const o={cmds:v("cmds").map(x=>({name:x.name,arg:x.arg==="req"?"req":"none"})),hints:v("hints").map(x=>({word:x.word,msg:x.msg})),targets:v("targets").map(x=>({word:x.word.trim()})),
  pats:v("pats").map(x=>({pat:x.pat,re:!!x.re,lv:x.lv==="e"?"e":"w",msg:x.msg})),colors:v("colors").map(x=>({word:x.word,color:x.color})),yes:G.yes,no:G.no};
 return PKG["gui-rules.js"].replace("const G = {};",()=>"const G = "+JSON.stringify(o)+";")}

 const d=await (window.claude?window.claude.use("downloads"):null);
 if(!d){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();msg("ダウンロードしました");return}
 try{await d.save({filename:fn,data:blob});msg("保存しました")}catch(e){if(e.code!=="declined")msg("保存できませんでした（"+(e.code||"error")+"）")}
}
